[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-radar"
version = "0.1.0"
description = "Discover, enrich, and score newly funded and remote-friendly startups."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "httpx>=0.27.2",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "feedparser>=6.0.11",
  "pandas>=2.2.3",
  "rapidfuzz>=3.10.1",
  "tldextract>=5.1.3",
  "tenacity>=9.0.0",
  "python-slugify>=8.0.4",
  "orjson>=3.10.11",
]

[project.optional-dependencies]
scrapy = ["scrapy>=2.11.2"]
js = ["playwright>=1.48.0"]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.4",
]

[tool.setuptools.packages.find]
where = ["packages", "apps", "workers", "sources", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["packages", "apps", "workers", "sources", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
